# ============================================================
# DỰ ÁN: ComicHub
# FILE: backend/src/main/resources/application.properties
# PHỤ TRÁCH: TV1 (Backend/Security); TV3 phối hợp xác minh SQL Server
# MỤC ĐÍCH: Cấu hình Spring Boot, datasource, JPA, upload, JWT và CORS.
# TRẠNG THÁI: ĐÃ CÓ CẤU HÌNH NỀN; CẦN KIỂM TRA KHI CHẠY THỰC TẾ.
# CÒN THIẾU: Xác minh import .env theo working directory, kết nối DB,
#            ddl-auto=validate, upload path, JWT secret và CORS trong môi trường chạy.
# LƯU Ý: Không ghi secret/password thật vào Git; không đổi ddl-auto thành create/update
#        tùy tiện vì schema do database/schema/Create_Tables.sql quản lý.
# ============================================================
spring.application.name=comichub

# Đọc .env (thử cả hai vị trí, tùy bạn chạy app từ thư mục nào)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===== Database =====
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Upload =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=${UPLOAD_DIR:../uploads}
logging.level.org.springframework.security=INFO

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}